<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicoach Tutorials</title>
<style>
  /* Medicoach brand: black logo, navy #003D93 (app primary), red #E13A30 (app highlight) */
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --surface-2: #eef2f9; --text: #0b0f19; --muted: #596277;
    --line: #dde3ee; --accent: #003d93; --accent-ink: #ffffff; --accent-soft: #e2eaf7; --red: #e13a30;
    --mark: #fde2df; --mark-ink: #8f1d15; --shadow: 0 1px 2px rgb(0 20 60 / .05), 0 4px 16px rgb(0 20 60 / .07);
    --logo-filter: none; --logo-blend: multiply;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #080c15; --surface: #10172a; --surface-2: #18223a; --text: #eaeef6; --muted: #98a3ba;
      --line: #232f4a; --accent: #7ea6ff; --accent-ink: #04122f; --accent-soft: #15254a; --red: #ff6b5f;
      --mark: #5a1d18; --mark-ink: #ffdcd8; --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
      --logo-filter: invert(1); --logo-blend: screen;
    }
  }
  :root[data-theme="dark"] {
    --bg: #080c15; --surface: #10172a; --surface-2: #18223a; --text: #eaeef6; --muted: #98a3ba;
    --line: #232f4a; --accent: #7ea6ff; --accent-ink: #04122f; --accent-soft: #15254a; --red: #ff6b5f;
    --mark: #5a1d18; --mark-ink: #ffdcd8; --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
    --logo-filter: invert(1); --logo-blend: screen;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 2px; }

  header { padding: 48px 16px 20px; text-align: center; }
  .brand { display: inline-flex; flex-direction: column; align-items: center; gap: 10px; }
  .brand img { height: 40px; width: auto; filter: var(--logo-filter); mix-blend-mode: var(--logo-blend); }
  .brand span { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  h1 { margin: 8px 0 6px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.02em; line-height: 1.15; }
  .sub { margin: 0; color: var(--muted); }

  .search-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 10px; }
  .search { max-width: 760px; margin: 0 auto; position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #q { width: 100%; font: inherit; font-size: 17px; padding: 15px 44px 15px 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); box-shadow: var(--shadow); outline: none; }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: var(--surface-2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: none; color: var(--muted); }
  .chips { max-width: 760px; margin: 12px auto 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .suggest { max-width: 760px; margin: 10px auto 0; text-align: center; font-size: 13px; color: var(--muted); }
  .suggest button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px; text-decoration: underline; text-underline-offset: 2px; }

  main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 64px; }
  .status { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: var(--shadow); outline: none; border-color: var(--accent); }
  .thumb { position: relative; aspect-ratio: 16/9; background: #050a18; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgb(0 0 0 / .72); color: #fff; font-size: 12px; padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
  .card:hover .play { opacity: 1; }
  .play span { width: 48px; height: 48px; border-radius: 50%; background: rgb(255 255 255 / .92); display: grid; place-items: center; color: #003d93; }
  .card-body { padding: 12px 14px 14px; }
  .cat { font-size: 12px; color: var(--accent); font-weight: 600; }
  .card h3 { margin: 2px 0 0; font-size: 15px; line-height: 1.3; }
  .card p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .results { display: flex; flex-direction: column; gap: 14px; }
  .result { display: grid; grid-template-columns: 220px 1fr; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .result .thumb { border-radius: 10px; overflow: hidden; cursor: pointer; align-self: start; }
  .result h3 { margin: 2px 0 4px; font-size: 17px; cursor: pointer; }
  .result h3:hover { color: var(--accent); }
  .result .why { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .moments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .moment { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 14px; }
  .moment:hover { background: var(--surface-2); }
  .ts { flex: none; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty strong { color: var(--text); display: block; font-size: 17px; margin-bottom: 4px; }

  dialog { width: min(1180px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgb(0 0 0 / .35); overflow: hidden; }
  dialog::backdrop { background: rgb(4 10 28 / .65); backdrop-filter: blur(3px); }
  .player { display: grid; grid-template-columns: 1fr 340px; height: min(680px, calc(100vh - 34px)); }
  .stage { background: #000; display: flex; flex-direction: column; min-width: 0; }
  .stage video { flex: 1; width: 100%; min-height: 0; background: #000; }
  .side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .side-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .side-head h2 { margin: 0; font-size: 16px; line-height: 1.3; }
  .side-head .cat { display: block; }
  .x { margin-left: auto; flex: none; border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .side-sum { padding: 10px 16px 0; margin: 0; font-size: 13px; color: var(--muted); }
  .tr-label { padding: 12px 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .transcript { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
  .line { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--muted); align-items: baseline; }
  .line:hover { background: var(--surface-2); color: var(--text); }
  .line.now { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--red); }
  .no-tr { padding: 0 16px; font-size: 13px; color: var(--muted); }

  @media (max-width: 600px) {
    header { padding-top: 28px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; margin-inline: -16px; padding: 0 16px; scrollbar-width: none; }
    .chip { flex: none; }
    .suggest { display: none; }
  }
  @media (max-width: 860px) {
    .player { grid-template-columns: 1fr; height: auto; max-height: calc(100vh - 34px); }
    .stage video { max-height: 45vh; }
    .side { border-left: 0; border-top: 1px solid var(--line); max-height: 50vh; }
    .result { grid-template-columns: 1fr; }
  }
</style>
</head>

oooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//Z"}, {"path": "Workflows/Workflow 01 - Review and readiness.mp4", "title": "Workflow 1: Review and readiness", "category": "Workflows", "summary": "The weekly start on the dashboard: check squad readiness and team load, clear alerts, sort the athlete table by ACWR, and follow up on red or flagged players.", "keywords": "weekly cycle four phases review readiness green amber red traffic light team load overworked alerts wearable inactivity sync attention required academic pressure athlete table acwr sort vitals sleep energy soreness player dashboard trends", "duration": 68.6, "segments": [{"t": 0.2, "text": "Workflow 1. Review and Readiness. It's the first thing you do every week, and it all"}, {"t": 5.7, "text": "happens on the main dashboard. Every fixture runs on the same four-phase cycle. Review,"}, {"t": 11.6, "text": "selection, preparation, and match. Review comes first, because what you find here shapes"}, {"t": 17.4, "text": "every decision after it. Open the dashboard and pick your team. Squad Readiness shows"}, {"t": 22.1, "text": "who's green, amber, or red, and Team Load tells you whether the squad is being over"}, {"t": 26.7, "text": "or underworked. Tap any card for the detail, like your recent match results. Next, check the alerts."}, {"t": 32.0, "text": "Wearable inactivity shows who hasn't synced their device, and attention required flags,"}, {"t": 36.3, "text": "clinical injuries, and academic pressure. Then scan the athlete table. Sort by any column,"}, {"t": 41.3, "text": "like ACWR, and the players who need you come straight to the top. Tap any player for today's"}, {"t": 46.3, "text": "vitals, like sleep, energy, and soreness. Then open their full player dashboard to see how"}, {"t": 51.8, "text": "their wellness and workload are trending over time. So, every week, check readiness and load."}, {"t": 57.1, "text": "Clear the alerts, scan the table, and follow up with any red or flagged players before you plan."}, {"t": 61.9, "text": "Then, you're ready for selection. That's Workflow 1. Next up, selection."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAAAAAgUXVpY2tUaW1lICduY2xjJyBWaWRlbyAoMSwxMywyKQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHRleHQAAAAAQ29weXJpZ2h0IDIwMDcgQXBwbGUgSW5jLgAAAFhZWiAAAAAAAADzUQABAAAAARbMWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPcGFyYQAAAAAAAwAAAAJmZAAA8q8AAA1QAAATtgAACfx2Y2d0AAAAAAAAAAEAAQAAAAAAAAABAAAAAQAAAAAAAAABAAAAAQAAAAAAAAABAABuZGluAAAAAAAAADYAAKPXAABUewAATM0AAJmaAAAmZgAAD1wAAFANAABUOQACZmYAAmZmAAJmZgAAAAAAAAAA/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAwMDAwMDBgMDBggGBgYICwgICAgLDQsLCwsLDRANDQ0NDQ0QEBAQE nce, then the roster."}, {"t": 56.1, "text": "Every pick has evidence behind it."}, {"t": 58.1, "text": "That's Workflow 2."}, {"t": 59.5, "text": "Next up, preparation."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAAAAAgUXVpY2tUaW1lICduY2xjJyBWaWRlbyAoMSwxMywyKQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHRleHQAAAAAQ29weXJpZ2h0IDIwMDcgQXBwbGUgSW5jLgAAAFhZWiAAAAAAAADzUQABAAAAARbMWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPcGFyYQAAAAAAAwAAAAJmZAAA8q8AAA1QAAATtgAACfx2Y2d0AAAAAAAAAAEAAQAAAAAAAAABAAAAAQAAAAAAAAABAAAAAQAAAAAAAAABAABuZGluAAAAAAAAADYAAKPXAABUewAATM0AAJmaAAAmZgAAD1wAAFANAABUOQACZmYAAmZmAAJmZgAAAAAAAAAA/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAwMDAwMDBgMDBggGBgYICwgICAgLDQsLCwsLDRANDQ0NDQ0QEBAQEBAQEBMTExMTExcXFxcXGhoaGhoaGhoaGv/bAEMBBAQEBgYGCwYGC preparation practice field session plan schedule new practice activities drills coach work time attendance feedback session effort rpe", "duration": 55.7, "segments": [{"t": 0.2, "text": "Workflow 3. Preparation. This is how a field coach plans a session, runs it, and"}, {"t": 5.6, "text": "captures feedback. Preparation is the third phase. Coaches plan practices, S&C"}, {"t": 11.4, "text": "builds programs, and the clinical team sets return to play dates. Go to"}, {"t": 15.7, "text": "practice, then practice schedule. Your previous practices are listed here so you"}, {"t": 20.2, "text": "can build on what the squad has already done. Top new practice and give the"}, {"t": 24.2, "text": "session a name, date, start time, and location, then add your first activity."}, {"t": 28.5, "text": "Each activity gets a type, a name, the coach is running it, and the work time. Add"}, {"t": 34.0, "text": "as many as you need and the session time builds up as you go. After the session,"}, {"t": 38.3, "text": "open feedback and record how each player went. It's saved against the session,"}, {"t": 42.2, "text": "ready for the next one. So, plan the practice, build the activities, take"}, {"t": 46.0, "text": "attendance on the day, and add feedback afterwards. The player's session effort"}, {"t": 49.7, "text": "then shows on the dashboard. That's Workflow 3. Next up, Match Day."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAA y ball live, and review it afterwards."}, {"t": 51.1, "text": "That review starts the next cycle. That's Workflow 4. Next up, SNC Programs."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAAAAAgUXVpY2tUaW1lICduY2xjJyBWaWRlbyAoMSwxMywyKQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHRleHQAAAAAQ29weXJpZ2h0IDIwMDcgQXBwbGUgSW5jLgAAAFhZWiAAAAAAAADzUQABAAAAARbMWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPcGFyYQAAAAAAAwAAAAJmZAAA8q8AAA1QAAATtgAACfx2Y2d0AAAAAAAAAAEAAQAAAAAAAAABAAAAAQAAAAAAAAABAAAAAQAAAAAAAAABAABuZGluAAAAAAAAADYAAKPXAABUewAATM0AAJmaAAAmZgAAD1wAAFANAABUOQACZmYAAmZmAAJmZgAAAAAAAAAA/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAwMDAwMDBgMDBggGBgYICwgICAgLDQsLCwsLDRANDQ0NDQ0QEBAQEBAQEBMTExMTExcXFxcXGhoaGhoaGhoaGv/bAEMBBAQEBgYGCwYGCxsSDxIbGxsbGxsbGxsbGxsbGxsbGxs n effort from the gym then shows on the dashboard."}, {"t": 43.2, "text": "That's Workflow 5. Next up, clinical."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAAAAAgUXVpY2tUaW1lICduY2xjJyBWaWRlbyAoMSwxMywyKQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHRleHQAAAAAQ29weXJpZ2h0IDIwMDcgQXBwbGUgSW5jLgAAAFhZWiAAAAAAAADzUQABAAAAARbMWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPcGFyYQAAAAAAAwAAAAJmZAAA8q8AAA1QAAATtgAACfx2Y2d0AAAAAAAAAAEAAQAAAAAAAAABAAAAAQAAAAAAAAABAAAAAQAAAAAAAAABAABuZGluAAAAAAAAADYAAKPXAABUewAATM0AAJmaAAAmZgAAD1wAAFANAABUOQACZmYAAmZmAAJmZgAAAAAAAAAA/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAwMDAwMDBgMDBggGBgYICwgICAgLDQsLCwsLDRANDQ0NDQ0QEBAQEBAQEBMTExMTExcXFxcXGhoaGhoaGhoaGv/bAEMBBAQEBgYGCwYGCxsSDxIbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGxsbGx ": "To record an injury, choose the player, the date and their availability,"}, {"t": 30.2, "text": "select the body part, and rate the severity, save it,"}, {"t": 34.2, "text": "and their readiness color updates on the dashboard."}, {"t": 37.2, "text": "Injury history keeps every injury on one record,"}, {"t": 40.2, "text": "so the full picture is there when you set a return to play date."}, {"t": 43.2, "text": "So, verify what players disclose, record each injury properly,"}, {"t": 47.2, "text": "set the return to play date, and mark players as recovered."}, {"t": 50.2, "text": "Coaches and S&Cs see it all. That's the full series."}, {"t": 53.2, "text": "Six workflows, one cycle, and every coach working from the same data."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAAAAAgUXVpY2tUaW1lICduY2xjJyBWaWRlbyAoMSwxMywyKQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHRleHQAAAAAQ29weXJpZ2h0IDIwMDcgQXBwbGUgSW5jLgAAAFhZWiAAAAAAAADzUQABAAAAARbMWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPcGFyYQAAAAAAAwAAAAJmZAAA8q8AAA1QAAATtgAACfx2Y2d0AAAAAAAAAAEAAQAAAAAAAAABAAAAAQAAAAAAAAABAAAAAQAAAAAAAAABAABuZGluAAAAAAAAADYAAKPXAABUewAATM0AAJmaAAAmZgAAD1wAAFANAABUOQACZmYAAmZmAAJmZgAAAAAAAAAA/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJ Pun60/V/wDj6j/3D/MUy0+6frXXD4CHuW6KKKQz/9k="}, {"path": "Practices/Medicoach Field Session.mp4", "title": "Running your first field session", "category": "Practices", "summary": "Reuse sessions from the practice schedule, build a new practice with activities and owners, and capture player feedback afterwards.", "keywords": "practice session training schedule template new practice activities drills venue duration feedback rpe workflow", "duration": 95.8, "segments": [{"t": 0.1, "text": "Phase two, into your workflow."}, {"t": 3.0, "text": "This is where MediCoach becomes part of how you actually coach,"}, {"t": 6.3, "text": "and it starts with your first field session."}, {"t": 9.1, "text": "The first field session comes down to three things."}, {"t": 11.7, "text": "Bring in the practices your team already runs,"}, {"t": 14.0, "text": "build a brand new session from scratch,"}, {"t": 15.8, "text": "and capture player feedback once it's done."}, {"t": 18.3, "text": "Let's start with what you already have."}, {"t": 20.1, "text": "Under practice, open practice schedule."}, {"t": 22.9, "text": "Every session your squad has, run lives here,"}, {"t": 25.4, "text": "ready to reuse as a template with a single click."}, {"t": 28.0, "text": "To build a fresh one, open new practice."}, {"t": 30.5, "text": "Give it a name, a date, and a venue, set your start time,"}, {"t": 33.5, "text": "and choose a target duration for the session."}, {"t": 35.8, "text": "Now add your activities."}, {"t": 37.1, "text": "Pick a type, like strapping, name it, and assign an owner"}, {"t": 40.0, "text": "so everyone knows who's leading it."}, {"t": 41.8, "text": "Set the work and activity times,"}, {"t": 43.3, "text": "add the group and player numbers,"}, {"t": 44.6, "text": "flag whether it needs filming, and drop in any notes."}, {"t": 47.2, "text": "As you build, MediCoach tracks player time"}, {"t": 49.5, "text": "and field time live against your target."}, {"t": 51.8, "text": "Need two things at once."}, {"t": 54.1, "text": "Group them into a parallel block,"}, {"t": 56.0, "text": "so your strapping and a backline meeting run side by side."}, {"t": 59.0, "text": "Add a transition between blocks"}, {"t": 60.2, "text": "and the plan reads like a real session timeline."}, {"t": 62.5, "text": "And it's all drag and drop,"}, {"t": 63.8, "text": "so you can reshape the whole session in seconds."}, {"t": 66.2, "text": "Once you've run it, come back to the feedback tab."}, {"t": 68.8, "text": "Every session can carry both coach and player feedback,"}, {"t": 71.8, "text": "and you'll see at a glance"}, {"t": 72.9, "text": "which practices already have it."}, {"t": 74.8, "text": "Because every session is logged against the athlete,"}, {"t": 77.2, "text": "you can see the technical work your players"}, {"t": 78.8, "text": "have actually been exposed to."}, {"t": 80.5, "text": "So you plan the next practice around what's missing,"}, {"t": 83.2, "text": "an aerial block to close a four-week gap."}, {"t": 85.7, "text": "You run it on the pitch,"}, {"t": 86.8, "text": "and the minutes are captured live as each block completes."}, {"t": 90.0, "text": "Today's session becomes tomorrow's history,"}, {"t": 92.3, "text": "and every session you run"}, {"t": 93.8, "text": "makes the next one better informed."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAAegAAAAOZ1RSQwAAAegAAAAOZGVzYwAAAAAAAAAFSERUVgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ts": [{"t": 0.0, "text": "Phase three, high performance."}, {"t": 2.2, "text": "This is where you start coaching with the tools."}, {"t": 4.4, "text": "And the first of them is the player development plan,"}, {"t": 7.4, "text": "a simple way to sit down with a player"}, {"t": 9.3, "text": "and talk honestly about their development journey."}, {"t": 11.8, "text": "Set aside 30 to 45 minutes, the player leads."}, {"t": 15.2, "text": "They rate themselves before you say a word."}, {"t": 17.0, "text": "Then you ask questions, draw out their reasoning"}, {"t": 19.3, "text": "and add your own assessment."}, {"t": 20.8, "text": "We cover all sports,"}, {"t": 22.1, "text": "so every coach has the tools to perform at their best."}, {"t": 24.9, "text": "Inside MediCoach, open player development plan"}, {"t": 27.5, "text": "under high performance."}, {"t": 29.0, "text": "Your team dashboard shows every assessment at a glance,"}, {"t": 32.1, "text": "how many you've run, who's been assessed"}, {"t": 34.2, "text": "and your team average."}, {"t": 35.6, "text": "To start a new one, create a development plan."}, {"t": 37.8, "text": "Choose your player, then the position you're assessing,"}, {"t": 40.1, "text": "batsman, bowler, wicket keeper or fielder,"}, {"t": 42.2, "text": "each with its own set of skills."}, {"t": 43.8, "text": "Now, rate the attributes, category by category,"}, {"t": 46.5, "text": "technical, tactical, physical and mental."}, {"t": 49.0, "text": "Every skill is scored from one to 10 and color coded,"}, {"t": 51.6, "text": "so strengths and gaps jump straight out."}, {"t": 54.0, "text": "Work through each category, add any notes"}, {"t": 56.0, "text": "and review the full picture side by side"}, {"t": 57.7, "text": "before you submit."}, {"t": 59.2, "text": "Every assessment feeds the bigger view,"}, {"t": 61.0, "text": "progress by player, by position"}, {"t": 62.6, "text": "and across your whole squad over time."}, {"t": 65.3, "text": "And here's the real power of it."}, {"t": 66.9, "text": "Step one, measure."}, {"t": 68.6, "text": "Capture the player's metrics today."}, {"t": 70.4, "text": "The baseline every later test is read against."}, {"t": 72.9, "text": "Step two, intervene."}, {"t": 74.7, "text": "Add your coaching drills to the plan,"}, {"t": 76.4, "text": "each one tied to the exact metric it's meant to move."}, {"t": 79.0, "text": "Step three, re-measure."}, {"t": 80.6, "text": "Run the same tests eight weeks on"}, {"t": 82.0, "text": "so the improvement is measured, not assumed."}, {"t": 84.2, "text": "One plan, four seasons, three coaches"}, {"t": 86.3, "text": "and every coach picks up exactly"}, {"t": 87.9, "text": "where the last one left off."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAAegAAAAOZ1RSQwAAAegAAAAOZGVzYwAAAAAAAAAFSERUVgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAdGV4dAAAAABDb3B5cmlnaHQgMjAwNyBBcHBsZSBJbmMuAAAAWFlaIAAAAAAAAPNRAAEAAAABFsxYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9jdXJ2AAAAAAAAAAEB9gAAdmNndAAAAAAAAAABAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAbmRpbgAAAAAAAAA2AACj1wAAVHsAAEzNAACZmgAAJmYAAA9cAABQDQAAVDkAAfYEAAH2BAAB9gQAAAAAAAAAAHNmMzIAAAAAAAEMQgAABd7///MmAAAHkwAA/ZD///ui///9owAAA9wAAMBu/8AAEQgBaQKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJCh ing all landing on the same athlete as your session"}, {"t": 55.8, "text": "You get the same read across the whole squad"}, {"t": 57.8, "text": "So you can see who's ready before anyone steps onto the field and it reaches you before you plan"}, {"t": 62.5, "text": "flagged in context in the same place as your session a"}, {"t": 66.2, "text": "30-second warning check"}, {"t": 68.4, "text": "For the players who don't have a device yet"}, {"t": 70.3, "text": "We've partnered with polar so your whole squad can start with the same data from day one"}, {"t": 75.6, "text": "Three loads one athlete record. That's wearables in your coaching workflow"}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAAegAAAAOZ1RSQwAAAegAAAAOZGVzYwAAAAAAAAAFSERUVgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAdGV4dAAAAABDb3B5cmlnaHQgMjAwNyBBcHBsZSBJbmMuAAAAWFlaIAAAAAAAAPNRAAEAAAABFsxYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9jdXJ2AAAAAAAAAAEB9gAAdmNndAAAAAAAAAABAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAbmRpbgAAAAAAAAA2AACj1wAAVHsAAEzNAACZmgAAJmYAAA9cAABQDQAAVDkAAfYEAAH2BAAB9gQAAAAAAAAAAHNmMzIAAAAAAAEMQgAABd7///MmAAAHkwAA/ZD///ui///9owAAA9wAAMBu/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4 pository,"}, {"t": 9.8, "text": "fitness analytics, programs, and team assessment."}, {"t": 12.5, "text": "Start in the planner."}, {"t": 13.6, "text": "Build a session for the whole team or a single athlete."}, {"t": 16.1, "text": "Group your exercises into a superset or a circuit,"}, {"t": 18.6, "text": "color code it, and add your movements."}, {"t": 20.6, "text": "Pull a movement from your library,"}, {"t": 22.0, "text": "or save the block as a template you'll reuse next week."}, {"t": 24.6, "text": "Each training day lays out cleanly."}, {"t": 26.2, "text": "Every exercise with its sets, reps, and target RPE,"}, {"t": 29.0, "text": "so the intent of the session is clear at a glance."}, {"t": 31.1, "text": "Duplicate a day, shift it across the calendar,"}, {"t": 33.1, "text": "and the week rebuilds around it."}, {"t": 34.5, "text": "Switch between team and player and day, week or month,"}, {"t": 36.7, "text": "to plan a whole block around each athlete's schedule."}, {"t": 38.6, "text": "Publish it, and the session lands in the athletes app."}, {"t": 40.8, "text": "The same plan you built, in their hands."}, {"t": 42.4, "text": "And here's the loop that makes it work."}, {"t": 43.9, "text": "Start with one testing battery across the squad."}, {"t": 45.9, "text": "Same test, same protocol, so the numbers compare."}, {"t": 48.2, "text": "Then prescribe against the gap."}, {"t": 49.5, "text": "Every exercise carries the quality it targets."}, {"t": 51.5, "text": "The program traces straight back to the test."}, {"t": 53.5, "text": "Protocols, technique guides,"}, {"t": 54.7, "text": "and benchmarks sit behind every step."}, {"t": 56.8, "text": "Versioned, attached to the module that uses them."}, {"t": 59.1, "text": "The workflow survives a change of staff."}, {"t": 60.8, "text": "Retest at week six, and the loop starts again."}, {"t": 63.1, "text": "One step better informed."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAY am, and roll it out to other"}, {"t": 41.9, "text": "teams in one step."}, {"t": 43.8, "text": "Plan for the whole team or a single athlete by day, week, or month."}, {"t": 48.2, "text": "That's the planner."}, {"t": 49.2, "text": "Build once, assign everywhere."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABmAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAAegAAAAOZ1RSQwAAAegAAAAOZGVzYwAAAAAAAAAFSERUVgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAdGV4dAAAAABDb3B5cmlnaHQgMjAwNyBBcHBsZSBJbmMuAAAAWFlaIAAAAAAAAPNRAAEAAAABFsxYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9jdXJ2AAAAAAAAAAEB9gAAdmNndAAAAAAAAAABAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAbmRpbgAAAAAAAAA2AACj1wAAVHsAAEzNAACZmgAAJmYAAA9cAABQDQAAVDkAAfYEAAH2BAAB9gQAAAAAAAAAAHNmMzIAAAAAAAEMQgAABd7///MmAAAHkwAA/ZD///ui///9owAAA9wAAMBu/8AAEQgBmAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/b n to play rtp availability pain recovered rehab", "duration": 58.6, "segments": [{"t": 0.0, "text": "Phase four, injury care, protecting your players."}, {"t": 3.9, "text": "An injury can be disclosed two ways,"}, {"t": 6.3, "text": "by the player themselves or by a clinician,"}, {"t": 8.8, "text": "your S and C, bio, physio, or doctor."}, {"t": 12.6, "text": "Every clinical injury sits right on your dashboard,"}, {"t": 15.3, "text": "who's hurt, who has a return date,"}, {"t": 17.0, "text": "and one click to mark them recovered."}, {"t": 19.5, "text": "Recording a new one is quick."}, {"t": 21.0, "text": "Choose the player and the body part,"}, {"t": 22.4, "text": "set the date and their availability,"}, {"t": 24.1, "text": "then add any notes or documents."}, {"t": 26.3, "text": "And team injury status shows the whole squad at a glance."}, {"t": 29.1, "text": "Every injury, its source, return date,"}, {"t": 31.1, "text": "progress and availability in one place."}, {"t": 33.2, "text": "Here's what makes it work."}, {"t": 34.6, "text": "Two ways in, the athlete on their phone"}, {"t": 36.5, "text": "or a clinician who saw it,"}, {"t": 37.8, "text": "but either route lands as one injury record, one assessment."}, {"t": 40.8, "text": "And the assessment is deliberately simple."}, {"t": 42.9, "text": "Select the injured site,"}, {"t": 44.0, "text": "then rate the pain on the visual analog scale."}, {"t": 46.4, "text": "It reaches you before you plan."}, {"t": 48.0, "text": "The status changes and today's session changes with it."}, {"t": 50.3, "text": "Disclosed, assessed, session adjusted, rerated,"}, {"t": 52.7, "text": "and you keep rerating right until the score clears"}, {"t": 54.6, "text": "and the player is back."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEB their decision, bat, or field."}, {"t": 44.8, "text": "From here, capture the pitch conditions and match type, and you're into the scoring setup."}, {"t": 49.6, "text": "Select your two batsmen, who's on strike and who's off strike,"}, {"t": 52.8, "text": "as well as selecting the opening bowler, and you are ready to begin."}, {"t": 56.3, "text": "As the match unfolds, you'll record every ball as it happens."}, {"t": 60.2, "text": "Enter runs as they're scored, singles, twos, threes, and when a boundary is hit,"}, {"t": 64.3, "text": "whether a four or a six, a wagon wheel will appear, letting you accurately mark exactly"}, {"t": 68.9, "text": "where the ball went. You'll also have a full range of options at your disposal."}, {"t": 72.8, "text": "To capture every outcome of the game, whether that's a wide, a no-ball, or a wicket,"}, {"t": 77.3, "text": "simply select the relevant option as it happens. If play pauses for drinks, click Drinks Break."}, {"t": 82.7, "text": "This records the interruption directly on the scorecard, so anyone following along"}, {"t": 86.6, "text": "knows exactly what's happening in the game at that point."}, {"t": 89.5, "text": "Throughout the match, you're in full control of your player details."}, {"t": 92.8, "text": "If there's a spelling mistake, or any other correction needed, you can edit a player's"}, {"t": 97.0, "text": "details at any time, and if the lineup changes, you can add a new player by entering their name"}, {"t": 101.9, "text": "and their player role. Once added, they'll appear on your player list on the player sheet,"}, {"t": 106.6, "text": "ready to be selected. You can also add notes as you go,"}, {"t": 110.2, "text": "keeping a running record alongside the score. Finally, once an over is complete,"}, {"t": 114.5, "text": "you'll be prompted to select a new bowler to continue the innings, and from there,"}, {"t": 118.6, "text": "the process simply repeats, ball by ball, over by over, until the innings is complete."}] YWz6GtC6/1x+g/lVC4/1TfQ0gFlJMyEnrEpPucUyQArg06T/XR/9ck/lTZPu0AXJeVRj1KjJ/CoR1qeX/Vx/wC6Kg70ySTJzUk3+rIqLv8AjUs3+rNA+h//2Q=="}, {"path": "Live scoring/Cricket Live score updated.mp4", "title": "Scoring a tournament cricket fixture", "category": "Live scoring", "summary": "Use Medicoach Scores to find a tournament fixture, enter the squads and confirmed players, and start live scoring.", "keywords": "cricket tournament fixture medicoach scores live score result match hub squad toss", "duration": 112.5, "segments": [{"t": 0.0, "text": "Welcome to the MediCoach Scores training video. To get started, head to your MediCoach homepage."}, {"t": 6.9, "text": "Once you've created your MediCoach Scores account, log in using your email and password."}, {"t": 11.8, "text": "You'll land on your MediCoach Scores dashboard, where you'll see Match,"}, {"t": 15.5, "text": "Live Scoring, Match Hub, MediCoach Live, and Tournaments."}, {"t": 19.4, "text": "Click on Tournaments, and you'll see a full list of available tournaments."}, {"t": 23.2, "text": "Select the relevant one you'll be scoring. A list of fixtures will appear."}, {"t": 27.0, "text": "Choose Enter Result or Live Score. Then click Live Score, followed by Start Live Score."}, {"t": 31.6, "text": "A set of fields will pop up, including opponent name and opponent squad."}, {"t": 35.2, "text": "Add your squad from player 1 through to 12. Then click Save Progress."}, {"t": 39.0, "text": "Next, click your squad and select the players who are confirmed as playing."}, {"t": 42.6, "text": "Then click Confirm. From there, select who won the toss, their decision to bat or field,"}, {"t": 47.4, "text": "the pitch condition, and the match type. Then click Save."}, {"t": 50.6, "text": "You'll then move to the scoring dashboard, where you select the batters on and off strike"}, {"t": 54.5, "text": "and choose the new bowler. And you're ready to start scoring."}, {"t": 57.4, "text": "Score the game by clicking dot balls, 1's, 2's, or 3's. For 4's and 6's,"}, {"t": 62.2, "text": "the wagon wheel will appear so you can mark the direction of the shot and confirm the position."}, {"t": 66.6, "text": "Once an over is complete, select a new bowler and repeat the same process."}, {"t": 70.5, "text": "If a player's name has a spelling mistake, click the pen icon to edit it, and from there,"}, {"t": 74.8, "text": "you can also mark them as Captain or Wicket Keeper."}, {"t": 77.4, "text": "Confirm the changes, then select Done Editing before starting the next over."}, {"t": 81.0, "text": "If you make a scoring mistake, simply press Undo to reverse the last entry."}, {"t": 84.8, "text": "For a wicket, select Wicket, choose which batsman is out,"}, {"t": 87.7, "text": "select the type of dismissal, and click Submit, then confirm the new batsman coming in."}, {"t": 92.6, "text": "You can also add players at any point by clicking Add Player,"}, {"t": 95.6, "text": "selecting the team, and typing in the player's name and role."}, {"t": 98.6, "text": "The new player will then appear under either the batting team or the bowling team."}, {"t": 102.6, "text": "Finally, click View Live Score to see the live score card exactly as it appears to"}, {"t": 106.5, "text": "the public and spectators and make sure to share it with everyone following the match."}, {"t": 110.2, "text": "And that's it! You're all set to score live with Medi-"}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABagAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAA se time cricket. This brings up the"}, {"t": 40.5, "text": "time cricket settings, where you'll enter the specifics for this match, minimum overs per day,"}, {"t": 45.0, "text": "in this case 90, the close of play time, in this case 5pm, and the follow on threshold,"}, {"t": 50.2, "text": "which for now is set at 100, but can be adjusted depending on the game."}, {"t": 54.6, "text": "Once these details are entered, click save. This takes you into the innings setup,"}, {"t": 58.6, "text": "where you'll enter the on strike batsman, the off strike batsman, and the opening bowler."}, {"t": 63.4, "text": "Once these are in place, click confirm innings setup, and you'll land on the full scoring input"}, {"t": 68.2, "text": "portal, ready to begin scoring the game. From here, you'll be working with two main areas,"}, {"t": 73.1, "text": "match management and input control. Match management covers the tools that shape the"}, {"t": 77.6, "text": "flow of a time cricket match. Declare ends the current innings by choice, with wickets"}, {"t": 82.1, "text": "still in hand. Follow on forces the batting side to bat again immediately, and only becomes"}, {"t": 87.1, "text": "available once the follow on threshold has been reached. Close of play marks the end of play for"}, {"t": 91.9, "text": "the day. Deduct overs removes overs from that day's allocation. Rundown runs the over countdown at"}, {"t": 97.0, "text": "a mid over change of innings. Simply enter the details and confirm. Lunch pauses the session"}, {"t": 101.8, "text": "without disturbing the ball or over count, and once play resumes, you'll select the next"}, {"t": 105.9, "text": "batsman. T works the same way. Set target lets you set a chase target with an explicit number,"}, {"t": 111.0, "text": "using the over multiplier rule, and records whether the leading side is defending,"}, {"t": 115.0, "text": "or the chasing side is pursuing that target. Second innings brings the match round, so the"}, {"t": 119.8, "text": "side that batted first can set a target with a wicket-based win condition for the bowling side."}, {"t": 124.4, "text": "For example, four wickets to win. Finally, you have end match and match drawn to close out the"}, {"t": 129.8, "text": "game. Input control is where you record the game. Ball by ball, dot balls, ones, twos, threes,"}, {"t": 136.6, "text": "and every run scored. There's also a drinks break option, which you can click to reflect"}, {"t": 141.2, "text": "the break directly on the scorecard. And that's how you score a time cricket match from start"}, {"t": 145.6, "text": "to finish on MediCoach."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABkgAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAAegAAAAOZ1RSQwAAAegAAAAOZGVzYwAAAAAAAAAFSERUVgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAdGV4dAAAAABDb3B5cmlnaHQgMjAwNyBBcHBsZSBJbmMuAAAAWFlaIAAAAAAAAPNRAAEAAAABFsxYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9jdXJ2AAAAAAAAAAEB9gAAdmNndAAAAAAAAAABAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAbmRpbgAAAAAAAAA2AACj1wAAVHsAAEzNAACZmgAAJmYAAA9cAABQDQAAVDkAAfYEAAH2BAAB9gQAAAAAAAAAAHNmMzIAAAAAAAEMQgAABd7///MmAAAHkwAA/ZD///ui///9owAAA9wAAMBu/8AAEQgBkgKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqa enalty, and try."}, {"t": 5.3, "text": "The question is whether anyone captures it while it's happening."}, {"t": 8.3, "text": "Analysts call this coding a game."}, {"t": 11.3, "text": "Each moment is tagged with what happened, who was involved, where on the field, and when."}, {"t": 16.3, "text": "It usually means hours of video work after the final whistle."}, {"t": 19.3, "text": "MediCoach lets you code it live from the touchline."}, {"t": 22.3, "text": "Open live scoring from the menu and create a new match."}, {"t": 25.3, "text": "Add the opponent, the venue, and the date."}, {"t": 27.3, "text": "Set the kickoff time and referee, and pick the rules variant."}, {"t": 30.3, "text": "Next, load both squads, 1 to 23."}, {"t": 32.3, "text": "Pick your own registered players from the list, type names in for the opposition,"}, {"t": 35.3, "text": "and every player keeps their number and position."}, {"t": 37.3, "text": "Then, set up the match itself."}, {"t": 39.3, "text": "Choose the half length and team colors."}, {"t": 41.3, "text": "Upload the logos, check both squads side by side,"}, {"t": 44.3, "text": "and decide whether you're scoring solo or sharing it with a second scorer."}, {"t": 47.3, "text": "You can start the first half, and the console is ready."}, {"t": 50.3, "text": "Each team gets its own column of events."}, {"t": 52.3, "text": "Possession is tracked, and the match clock runs on its own."}, {"t": 55.3, "text": "Tap try and choose the scorer."}, {"t": 57.3, "text": "Then add where it came from, which side of the field, and how many phases it took."}, {"t": 61.3, "text": "Confirm, and the score updates instantly."}, {"t": 63.3, "text": "Turnovers, cards, missed tackles, and penalties all work the same way."}, {"t": 67.3, "text": "Pick the player, pick the reason, and the moment is coded with a timestamp in a couple of taps."}, {"t": 71.3, "text": "Penalties even record the offense."}, {"t": 73.3, "text": "From the breakdown to the scrum, line out in mall."}, {"t": 76.3, "text": "Because it's live, everyone else can follow too."}, {"t": 78.3, "text": "The public scorecard shows the score, possession, and a full match timeline,"}, {"t": 81.3, "text": "and supporters can subscribe for updates, so why does it matter?"}, {"t": 84.3, "text": "Because every coded moment becomes data."}, {"t": 87.3, "text": "Player stats build themselves."}, {"t": 89.3, "text": "Coaches see patterns, like which penalties keep costing territory,"}, {"t": 92.3, "text": "instead of relying on memory."}, {"t": 94.3, "text": "Selection has evidence behind it,"}, {"t": 96.3, "text": "and parents and supporters stay connected to every match."}, {"t": 99.3, "text": "MediCoach Rugby Live scoring."}, {"t": 101.3, "text": "Code the game as it happens."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICmElDQ19QUk9GSUxFAAEBAAACiGFwcGwEAAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAAB6Y3BydAAAAYQAAAAid3RwdAAAAagAAAAUclhZWgAAAbwAAAAUZ1hZWgAAAdAAAAAUYlhZWgAAAeQAAAAUclRSQwAAAfgAAAAgdmNndAAAAhgAAAAwbmRpbgAAAkgAAAA+YlRSQwAAAfgAAAAgZ1RSQwAAAfgAAAAgZGVzYwAAAAAAAAAgUXVpY2tUaW1lICduY2xjJyBWaWRlbyAoMSwxMywyKQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHRleHQAAAAAQ29weXJpZ2h0IDIwMDcgQXBwbGUgSW5jLgAAAFhZWiAAAAAAAADzUQABAAAAARbMWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPcGFyYQAAAAAAAwAAAAJmZAAA8q8AAA1QAAATtgAACfx2Y2d0AAAAAAAAAAEAAQAAAAAAAAABAAAAAQAAAAAAAAABAAAAAQAAAAAAAAABAABuZGluAAAAAAAAADYAAKPXAABUewAATM0AAJmaAAAmZgAAD1wAAFANAABUOQACZmYAAmZmAAJmZgAAAAAAAAAA/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECA const STOP = new Set("a an and are as at be but by can do does for from get go how i if in into is it its me my of on or so that the this to up use using want was we what when where which who why will with you your about there their them then than also just".split(" "));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const src = p => p.split("/").map(encodeURIComponent).join("/");
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const stem = w => w.length > 5 && w.endsWith("ing") ? w.slice(0, -3)
  : w.length > 4 && w.endsWith("ed") ? w.slice(0, -2)
  : w.length > 4 && w.endsWith("es") ? w.slice(0, -2)
  : w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w;
const SPELL = { colour: "color", colours: "colors", programme: "program", programmes: "programs", organise: "organize", analyse: "analyze", centre: "center", favourite: "favorite", kilogram: "kilograms", kg: "kilograms" };
const words = s => (s || "").toLowerCase().replace(/&/g, " and ").split(/[^a-z0-9]+/).filter(Boolean).map(w => SPELL[w] || w);

// Pre-index every field as stemmed word lists.
for (const v of VIDEOS) {
  v.idx = {
    title: words(v.title).map(stem),
    category: words(v.category).map(stem),
    meta: words(v.keywords + " " + v.summary).map(stem),
    segs: v.segments.map(s => words(s.text).map(stem)),
  };
  v.fullText = v.segments.map(s => s.text).join(" ");
}

function queryTerms(q) {
  const all = words(q);
  const kept = all.filter(w => !STOP.has(w));
  return [...new Set((kept.length ? kept : all).map(stem))];
}
const near = (w, t) => w.startsWith(t) || (w.length >= 5 && t.startsWith(w) && t.length - w.length <= 2);
const hit = (list, t) => list.some(w => near(w, t));

function search(q, cat) {
  const terms = queryTerms(q);
  const pool = VIDEOS.filter(v => !cat || v.category === cat);
  if (!terms.length) return { terms, list: pool.map(v => ({ v, moments: [] })) };
  const anywhere = (v, t) => hit(v.idx.title, t) || hit(v.idx.category, t) || hit(v.idx.meta, t) || v.idx.segs.some(seg => hit(seg, t));
  const idf = Object.fromEntries(terms.map(t => [t, 1 + Math.log(VIDEOS.length / Math.max(1, VIDEOS.filter(v => anywhere(v, t)).length))]));
  const list = [];
  for (const v of pool) {
    let score = 0; const covered = new Set();
    for (const t of terms) {
      if (hit(v.idx.title, t)) { score += 10 * idf[t]; covered.add(t); }
      if (hit(v.idx.category, t)) { score += 5 * idf[t]; covered.add(t); }
      if (hit(v.idx.meta, t)) { score += 4 * idf[t]; covered.add(t); }
    }
    const moments = [];
    v.idx.segs.forEach((seg, i) => {
      const n = terms.filter(t => hit(seg, t));
      const w = n.reduce((a, t) => a + idf[t], 0);
      if (n.length) { n.forEach(t => covered.add(t)); moments.push({ i, w: w * n.length }); }
    });
    score += Math.min(40, moments.reduce((a, m) => a + m.w, 0));
    if (!covered.size) continue;
    const coverage = [...covered].reduce((a, t) => a + idf[t], 0);
    moments.sort((a, b) => b.w - a.w || a.i - b.i);
    list.push({ v, score: score + coverage * 20, coverage, moments: moments.slice(0, 3).sort((a, b) => a.i - b.i) });
  }
  const best = Math.max(0, ...list.map(r => r.coverage));
  // When some videos match every term, hide ones that only match a minority of them.
  return { terms, list: list.filter(r => r.coverage >= best * 0.5).sort((a, b) => b.score - a.score) };
}

function highlight(text, terms) {
  if (!terms.length) return esc(text);
  return text.split(/([A-Za-z0-9']+)/).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    const s = stem(part.toLowerCase().replace(/'/g, ""));
    return terms.some(t => near(s, t)) ? "<mark>" + esc(part) + "</mark>" : esc(part);
  }).join("");
}

const thumb = v => `<div class="thumb">${v.thumb ? `<img src="${v.thumb}" alt="" loading="lazy">` : ""}
  ${v.duration ? `<span class="dur">${fmt(v.duration)}</span>` : ""}
  <div class="play"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div></div>`;

const excerpt = v => v.summary || (v.fullText.length > 120 ? v.fullText.slice(0, 117).replace(/\s+\S*$/, "") + "…" : v.fullText);

// ---- render ----
const cats = [...new Set(VIDEOS.map(v => v.category))];
let state = { q: "", cat: "" };

function renderChips() {
  $("#chips").innerHTML = ["", ...cats].map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${c ? esc(c) : "All topics"}</button>`).join("");
}

function render() {
  const { terms, list } = search(state.q, state.cat);
  $("#clear").style.display = state.q ? "block" : "none";
  const n = list.length;
  if (!state.q) {
    $("#status").textContent = `${n} tutorial${n === 1 ? "" : "s"}${state.cat ? " in " + state.cat : ""}`;
    $("#out").innerHTML = `<div class="grid">${list.map(({ v }) => `
      <button class="card" data-open="${esc(v.path)}">
        ${thumb(v)}
        <div class="card-body"><div class="cat">${esc(v.category)}</div><h3>${esc(v.title)}</h3>
        ${excerpt(v) ? `<p>${esc(excerpt(v))}</p>` : ""}</div>
      </button>`).join("")}</div>`;
    return;
  }
  if (!n) {
    $("#status").textContent = "";
    $("#out").innerHTML = `<div class="empty"><strong>No tutorials match “${esc(state.q)}”</strong>Try a shorter or different word, or browse a topic above.</div>`;
    return;
  }
  $("#status").textContent = `${n} matching tutorial${n === 1 ? "" : "s"}`;
  $("#out").innerHTML = `<div class="results">${list.map(({ v, moments }) => `
    <article class="result">
      <div data-open="${esc(v.path)}">${thumb(v)}</div>
      <div>
        <div class="cat">${esc(v.category)}</div>
        <h3 data-open="${esc(v.path)}">${highlight(v.title, terms)}</h3>
        ${v.summary ? `<p class="why">${highlight(v.summary, terms)}</p>` : ""}
        ${moments.length ? `<ul class="moments">${moments.map(m => `<li><button class="moment" data-open="${esc(v.path)}" data-t="${v.segments[m.i].t}">
          <span class="ts">${fmt(v.segments[m.i].t)}</span><span>${highlight(v.segments[m.i].text, terms)}</span></button></li>`).join("")}</ul>` : ""}
      </div>
    </article>`).join("")}</div>`;
}

// ---- player ----
const dlg = $("#dlg"), pv = $("#pv");
let current = null;
function openVideo(path, t = 0) {
  const v = VIDEOS.find(x => x.path === path); if (!v) return;
  current = v;
  const terms = queryTerms(state.q);
  $("#pcat").textContent = v.category;
  $("#ptitle").textContent = v.title;
  $("#psum").textContent = v.summary || "";
  $("#psum").style.display = v.summary ? "" : "none";
  $("#ptr").innerHTML = v.segments.length
    ? v.segments.map((s, i) => `<button class="line" data-i="${i}" data-t="${s.t}"><span class="ts">${fmt(s.t)}</span><span>${highlight(s.text, terms)}</span></button>`).join("")
    : `<p class="no-tr">This video has no spoken narration.</p>`;
  if (pv.dataset.path !== path) { pv.src = src(path); pv.dataset.path = path; }
  const start = () => { pv.currentTime = Math.max(0, t - 0.3); pv.play().catch(() => {}); };
  pv.readyState >= 1 ? start() : pv.addEventListener("loadedmetadata", start, { once: true });
  if (!dlg.open) dlg.showModal();
  history.replaceState(null, "", "#" + new URLSearchParams({ v: path, t: Math.floor(t) }));
}
function closeVideo() { pv.pause(); if (dlg.open) dlg.close(); }
dlg.addEventListener("close", () => { pv.pause(); history.replaceState(null, "", location.pathname + location.search); });
$("#pclose").onclick = closeVideo;
dlg.addEventListener("click", e => { if (e.target === dlg) closeVideo(); });

let lastNow = -1;
pv.addEventListener("timeupdate", () => {
  if (!current || !current.segments.length) return;
  let i = -1; for (let k = 0; k < current.segments.length; k++) { if (current.segments[k].t <= pv.currentTime + 0.2) i = k; else break; }
  if (i === lastNow) return;
  lastNow = i;
  $("#ptr").querySelectorAll(".line.now").forEach(el => el.classList.remove("now"));
  const el = $("#ptr").querySelector(`[data-i="${i}"]`);
  if (el) { el.classList.add("now"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
});
$("#ptr").addEventListener("click", e => { const b = e.target.closest(".line"); if (b) { pv.currentTime = +b.dataset.t; pv.play().catch(() => {}); } });

// ---- wiring ----
let timer;
$("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); render(); toTop(); }, 80); });
const toTop = () => { const y = $("main").offsetTop - $(".search-wrap").offsetHeight; if (scrollY > y) scrollTo({ top: y }); };
$("#clear").onclick = () => { $("#q").value = ""; state.q = ""; render(); $("#q").focus(); };
$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; state.cat = state.cat === c.dataset.cat ? "" : c.dataset.cat; renderChips(); render(); });
$("#out").addEventListener("click", e => { const o = e.target.closest("[data-open]"); if (o) openVideo(o.dataset.open, +(o.dataset.t || 0)); });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q") && !dlg.open) { e.preventDefault(); $("#q").focus(); } });

const SUGGEST = ["add a player", "live score", "injury", "training program", "wearables"];
$("#suggest").innerHTML = "Try: " + SUGGEST.map(s => `<button data-s="${esc(s)}">${esc(s)}</button>`).join("");
$("#suggest").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) { $("#q").value = b.dataset.s; state.q = b.dataset.s; render(); } });

renderChips(); render();
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("v")) openVideo(h.get("v"), +(h.get("t") || 0));
</script>
</body>
</html>
